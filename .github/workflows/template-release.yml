name: Template Release

on:
  push:
    branches: [main]
    tags: ["template-v*", "*-template-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the Team Template repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Materialize the pinned Runner Catalog Release
        run: |
          ./materialize-core-tool .core/rps-tournament
          python3 - <<'PY' > .team-templates.tsv
          import json
          from pathlib import Path
          from template_collection import load_collection

          lock = json.loads(Path("core-tool.lock.json").read_text())
          catalog_path = Path(".core/rps-tournament") / lock["catalog"]["path"]
          collection = load_collection(Path("."), catalog_path)
          for language_id in collection.language_ids:
              template = collection.select(language_id)
              print("\t".join((
                  template.language_id,
                  template.language_environment,
                  template.release_tag,
              )))
          PY
      - name: Verify the Template Release contract
        env:
          RPS_CORE_PATH: .core/rps-tournament
        run: |
          while IFS=$'\t' read -r template_id language_environment release_tag; do
            ./release-team-template --template "$template_id" manifest "$release_tag"
            toolchain="$(TEAM_LANGUAGE_ENVIRONMENT="$language_environment" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          lock = json.loads(Path("core-tool.lock.json").read_text())
          catalog_path = Path(".core/rps-tournament") / lock["catalog"]["path"]
          catalog = json.loads(catalog_path.read_text())
          environment = catalog["environments"][os.environ["TEAM_LANGUAGE_ENVIRONMENT"]]
          asset = environment["assets"]["build_toolchain"]["path"]
          runtimes = json.loads((catalog_path.parent / asset).read_text())
          print(runtimes["platforms"]["linux/amd64"]["build_toolchain"]["image"])
          PY
            )"
            docker pull --platform linux/amd64 "$toolchain"
            RPS_CORE_PATH=.core/rps-tournament \
              ./check-team-template --template "$template_id" --mode docker
          done < .team-templates.tsv
          rm -f .team-templates.tsv
          python3 -m unittest discover -s tests -v
      - name: Verify the published annotated Template Release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RPS_CORE_PATH: .core/rps-tournament
        run: |
          git fetch --no-tags --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          ./release-team-template verify "${GITHUB_REF_NAME}"
