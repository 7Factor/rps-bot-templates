name: Team Advisory Validation

on:
  push:
    branches: ["team/**"]

permissions:
  contents: read

concurrency:
  group: team-advisory-${{ github.ref }}
  cancel-in-progress: true

env:
  CATALOG: .core/rps-tournament/language_environments/catalog-v1/catalog.json
  PLATFORM: linux/amd64
  PYTHONPATH: .core/rps-tournament

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact Team commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize bundled pinned Tournament core
        id: core_lock
        run: |
          ./materialize-core-tool .core/rps-tournament
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from template_collection import load_collection
          from team_submission import resolve_team_submission

          with open("core-tool.lock.json") as stream:
              lock = json.load(stream)
          catalog_path = Path(".core/rps-tournament") / lock["catalog"]["path"]
          collection = load_collection(Path("."), catalog_path)
          template = resolve_team_submission(Path("."), collection)
          github_output = Path(os.environ["GITHUB_OUTPUT"])
          github_environment = Path(os.environ["GITHUB_ENV"])
          with github_output.open("a") as output:
              output.write("commit=" + lock["runner"]["commit"] + "\n")
          with github_environment.open("a") as environment:
              environment.write("TEAM_TEMPLATE_ID=" + template.language_id + "\n")
              environment.write(
                  "TEAM_LANGUAGE_ENVIRONMENT=" + template.language_environment + "\n"
              )
              environment.write(
                  "TEAM_TEMPLATE_RELEASE=" + template.release_tag + "\n"
              )
              environment.write(
                  "TEAM_SOURCE_PATH=" + template.team_source_path.as_posix() + "\n"
              )
          PY
      - name: Verify the exact Template Release
        id: template_release
        continue-on-error: true
        env:
          RPS_CORE_PATH: ${{ github.workspace }}/.core/rps-tournament
        run: |
          mkdir -p .advisory
          release_commit="$(git rev-parse "${TEAM_TEMPLATE_RELEASE}^{}")"
          git worktree add --detach .template-release "${release_commit}"
          .template-release/release-team-template \
            --template "$TEAM_TEMPLATE_ID" verify "$TEAM_TEMPLATE_RELEASE" \
            > .advisory/template-release.json
          git diff --quiet "${release_commit}" "${GITHUB_SHA}" \
            -- . ":(exclude)${TEAM_SOURCE_PATH}/**" \
            ":(exclude)team-submission.json" || {
              echo "Team branch changed files outside Team Source or its declaration" >&2
              exit 1
            }
      - name: Verify native Linux/AMD64 Docker
        if: steps.template_release.outcome == 'success'
        run: |
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = "$PLATFORM"
      - name: Cache the pinned Linux/AMD64 toolchain and runtime
        if: steps.template_release.outcome == 'success'
        run: |
          mapfile -t language_image_references < <(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from rps_runner.language_environment import load_catalog

          catalog_contract = load_catalog(Path(os.environ["CATALOG"]))
          runtimes = json.loads(
              catalog_contract.environment(
                  os.environ["TEAM_LANGUAGE_ENVIRONMENT"]
              ).assets["base_runtime"].content
          )
          selected = runtimes["platforms"]["linux/amd64"]
          for reference in sorted({
              selected["build_toolchain"]["image"],
              selected["execution_runtime"]["image"],
          }):
              print(reference)
          PY
          )
          for image_reference in "${language_image_references[@]}"; do
            docker pull --platform "$PLATFORM" "$image_reference"
          done
      - name: Build and test the Team Template in its pinned toolchain
        if: steps.template_release.outcome == 'success'
        env:
          RPS_CORE_PATH: ${{ github.workspace }}/.core/rps-tournament
        run: ./check-team-template --template "$TEAM_TEMPLATE_ID" --mode docker
      - name: Freeze Team Source
        id: source
        if: steps.template_release.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m rps_runner.source_cli \
            --catalog "$CATALOG" \
            --environment "$TEAM_LANGUAGE_ENVIRONMENT" \
            --source "$TEAM_SOURCE_PATH" \
            --bundle .advisory/source-bundle
      - name: Build disposable Linux/AMD64 confidence image
        id: build
        if: steps.source.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m rps_runner.artifact_cli \
            --catalog "$CATALOG" \
            --bundle .advisory/source-bundle \
            --platform "$PLATFORM" \
            --candidate .advisory/artifact-candidate
      - name: Run GitHub Advisory Validation
        id: advisory_validation
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m rps_runner.certification_cli \
            --catalog "$CATALOG" \
            --candidate .advisory/artifact-candidate \
            --mode github-advisory \
            --platform "$PLATFORM" \
            --profile docker-execution-v1 \
            --output .advisory/advisory-validation
      - name: Write commit-specific eligibility evidence
        id: evidence
        if: always()
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          CORE_COMMIT: ${{ steps.core_lock.outputs.commit }}
          TEMPLATE_RELEASE_OUTCOME: ${{ steps.template_release.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ADVISORY_VALIDATION_OUTCOME: ${{ steps.advisory_validation.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          root = Path(".advisory")
          destination = root / "evidence"
          destination.mkdir(parents=True, exist_ok=True)

          def read_json_object_or_empty(path):
              try:
                  value = json.loads(path.read_text())
                  return value if isinstance(value, dict) else {}
              except (OSError, json.JSONDecodeError):
                  return {}

          def get_nested_value(value, *keys):
              for key in keys:
                  if not isinstance(value, dict):
                      return None
                  value = value.get(key)
              return value

          source = read_json_object_or_empty(
              root / "source-bundle" / "source-bundle.json"
          )
          candidate = read_json_object_or_empty(
              root / "artifact-candidate" / "artifact-candidate.json"
          )
          report_path = root / "advisory-validation" / "validation-report.json"
          report = read_json_object_or_empty(report_path)
          template_release = read_json_object_or_empty(
              root / "template-release.json"
          )
          team_submission = read_json_object_or_empty(
              Path("team-submission.json")
          )
          unavailable = "not-produced"
          fallback_validation_identities = {
              "catalog": "unavailable",
              "core_tool": "unavailable",
              "suite": "unavailable",
              "recipe": "unavailable",
              "wrapper": "unavailable",
              "runtime_digest": "unavailable",
              "execution_profile": "unavailable",
          }
          try:
              from rps_runner.artifact_certification import (
                  SUITE_VERSION,
                  _core_tool_identity,
              )
              from rps_runner.execution_profile import INITIAL_EXECUTION_PROFILE
              from rps_runner.language_environment import load_catalog

              catalog_contract = load_catalog(Path(os.environ["CATALOG"]))
              language_environment = catalog_contract.environment(
                  os.environ["TEAM_LANGUAGE_ENVIRONMENT"]
              )
              conformance = language_environment.assets["conformance"]
              runtime_catalog = json.loads(
                  language_environment.assets["base_runtime"].content
              )
              runtime_reference = runtime_catalog["platforms"][
                  os.environ["PLATFORM"]
              ]["execution_runtime"]["image"]
              fallback_validation_identities = {
                  "catalog": catalog_contract.identity,
                  "core_tool": _core_tool_identity(),
                  "suite": SUITE_VERSION + "@" + conformance.digest,
                  "recipe": language_environment.assets["recipe"].identity,
                  "wrapper": language_environment.assets["wrapper"].identity,
                  "runtime_digest": runtime_reference.rsplit("@", 1)[1],
                  "execution_profile": INITIAL_EXECUTION_PROFILE.identity,
              }
          except (ImportError, KeyError, OSError, TypeError, ValueError):
              pass
          outcomes = {
              "template_release": os.environ.get(
                  "TEMPLATE_RELEASE_OUTCOME", "unknown"
              ),
              "source": os.environ.get("SOURCE_OUTCOME", "unknown"),
              "build": os.environ.get("BUILD_OUTCOME", "unknown"),
              "advisory_validation": os.environ.get(
                  "ADVISORY_VALIDATION_OUTCOME", "unknown"
              ),
          }
          passed = (
              all(value == "success" for value in outcomes.values())
              and report.get("status") == "passed"
              and report.get("mode") == "github-advisory"
              and report.get("platform") == os.environ["PLATFORM"]
          )
          evidence = {
              "evidence_format_version": "team-advisory-evidence-v1",
              "result": "passed" if passed else "failed",
              "authority": "github-advisory",
              "team_submission": team_submission,
              "template_release": {
                  "tag": get_nested_value(
                      template_release, "template_repository", "tag"
                  ) or unavailable,
                  "commit": get_nested_value(
                      template_release, "template_repository", "commit"
                  ) or unavailable,
                  "team_template_version": get_nested_value(
                      template_release, "team_template", "version"
                  ) or unavailable,
                  "team_template_digest": get_nested_value(
                      template_release, "team_template", "digest"
                  ) or unavailable,
                  "starter_source_digest": get_nested_value(
                      template_release,
                      "team_template",
                      "expected_source_digest",
                  ) or unavailable,
                  "advisory_validation_workflow": get_nested_value(
                      template_release,
                      "advisory_validation",
                      "workflow_identity",
                  ) or unavailable,
              },
              "source_commit": os.environ.get("SOURCE_COMMIT"),
              "source_digest": source.get("source_digest") or unavailable,
              "catalog": get_nested_value(report, "identities", "catalog")
                  or get_nested_value(candidate, "identities", "catalog")
                  or fallback_validation_identities["catalog"],
              "core_tool": get_nested_value(report, "identities", "core_tool")
                  or get_nested_value(candidate, "identities", "core_tool")
                  or fallback_validation_identities["core_tool"],
              "core_tool_commit": os.environ.get("CORE_COMMIT"),
              "suite": get_nested_value(report, "identities", "suite")
                  or fallback_validation_identities["suite"],
              "recipe": get_nested_value(report, "identities", "recipe")
                  or get_nested_value(candidate, "identities", "recipe")
                  or fallback_validation_identities["recipe"],
              "wrapper": get_nested_value(report, "identities", "wrapper")
                  or get_nested_value(candidate, "identities", "wrapper")
                  or fallback_validation_identities["wrapper"],
              "runtime_digest": candidate.get("runtime_digest")
                  or fallback_validation_identities["runtime_digest"],
              "platform": os.environ["PLATFORM"],
              "disposable_image_identity": get_nested_value(
                  candidate, "retention", "local_image_id"
              ) or unavailable,
              "execution_profile": get_nested_value(
                  report, "identities", "profile"
              ) or fallback_validation_identities["execution_profile"],
              "validation_identity": report.get("validation_identity"),
              "practice_match_result_gate": get_nested_value(
                  report, "checks", "practice_match_result_gate"
              ),
              "stage_outcomes": outcomes,
          }
          (destination / "eligibility-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          if report_path.is_file():
              shutil.copyfile(report_path, destination / "validation-report.json")
          template_release_path = root / "template-release.json"
          if template_release_path.is_file():
              shutil.copyfile(
                  template_release_path, destination / "template-release.json"
              )
          shutil.copyfile(
              "team-submission.json", destination / "team-submission.json"
          )

          lines = [
              "## GitHub Advisory Validation",
              "",
              "- Result: **" + evidence["result"] + "**",
              "- Source commit: `" + str(evidence["source_commit"]) + "`",
              "- Template Release: `"
                  + str(evidence["template_release"]["tag"])
                  + "@"
                  + str(evidence["template_release"]["commit"])
                  + "`",
              "- Source Digest: `" + str(evidence["source_digest"]) + "`",
              "- Platform: `" + evidence["platform"] + "`",
              "- Authority: Advisory Validation only; insufficient for official Tournament entry.",
          ]
          (root / "summary.md").write_text("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as outputs:
              outputs.write("result=" + evidence["result"] + "\n")
          PY
          cat .advisory/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Remove disposable confidence image
        if: always() && steps.build.outcome == 'success'
        run: |
          image_reference="$(python3 -c 'import json; print(json.load(open(".advisory/artifact-candidate/artifact-candidate.json"))["retention"]["local_image_reference"])')"
          docker image rm "$image_reference" || true
      - name: Retain Advisory Validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: team-advisory-${{ github.sha }}
          path: .advisory/evidence
          if-no-files-found: error
          retention-days: 90
      - name: Fail a nonconforming Submission Candidate
        if: always() && steps.evidence.outputs.result != 'passed'
        run: exit 1
